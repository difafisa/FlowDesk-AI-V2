[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowdesk"
version = "0.2.0"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: test yang butuh service eksternal (mis. PostgreSQL Docker) — dipakai mulai Tahap 7.3",
]
