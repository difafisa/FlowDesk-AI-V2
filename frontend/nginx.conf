# FlowDesk v2 — frontend service: static UI + reverse proxy ke API.
# Nama host `api` = nama service compose (DNS internal jaringan compose).
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Pertanyaan troubleshooting bisa berisi paste error log — batas longgar.
    client_max_body_size 1m;

    # Workflow (Jev + retry) bisa 30-60s: tanpa ini nginx memutus di 60s.
    proxy_read_timeout 300s;
    proxy_connect_timeout 5s;

    location /ask          { proxy_pass http://api:8000; }
    location /feedback     { proxy_pass http://api:8000; }
    location /health       { proxy_pass http://api:8000; }
    location /docs         { proxy_pass http://api:8000; }
    location /openapi.json { proxy_pass http://api:8000; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
